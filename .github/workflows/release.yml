name: release

# Run by hand from the Actions tab (or the API) after the PR is merged:
# it tags the chosen commit, publishes a GitHub release with the files in
# dist/ and the notes in .github/RELEASE_NOTES.md, and Zenodo archives the
# release and mints a DOI if the repository is switched on at
# https://zenodo.org/account/settings/github/.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
        default: "v2.0.0"
      target:
        description: "Branch or commit to tag"
        required: true
        default: "main"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target }}
      - name: Check the release files
        run: |
          N=Musin24CellConjectureTwoTranslates
          for f in "dist/${N}_final2.pdf" \
                   "dist/${N}_final2-tex.zip" \
                   "dist/${N}_final2-arxiv.tar.gz" \
                   "preprint$N/$N.pdf" \
                   "Master${N}_masterzipfinal2.zip"; do
            test -s "$f" || { echo "missing $f"; exit 1; }
          done
          test "$(ls "preprint$N")" = "$N.pdf" || { echo "preprint$N must hold only the PDF"; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
        run: |
          gh release create "$TAG" dist/* Master*_masterzipfinal2.zip \
            --target "$TARGET" \
            --title "$TAG: Densest packings of two translates of a lattice in four dimensions" \
            --notes-file .github/RELEASE_NOTES.md
